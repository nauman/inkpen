name: Release to RubyGems

# Triggers on push of a version tag (e.g. v0.8.0). The job rebuilds the
# vendored JS bundle, runs the Ruby + JS tests, builds the .gem, and
# pushes to rubygems.org.
#
# RubyGems trusted publisher configuration:
#   Repository owner: nauman
#   Repository name: inkpen
#   Workflow filename: release.yml
#   Environment: release
#
# To trigger a release:
#   1. Bump lib/inkpen/version.rb + inkpen.gemspec (stub + s.version)
#   2. npm run build && git add -A && git commit -m "bump: X.Y.Z"
#   3. git tag vX.Y.Z && git push origin main --tags
#
# The workflow only publishes when the tag matches the version in the
# gemspec — protects against accidental tag/version mismatches.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Existing version tag to publish (for example, 0.9.3)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    name: Build + publish ${{ github.ref_name }}
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.version) || github.ref }}

      # Guard against a stale Gemfile.lock when the gemspec was bumped
      # without running `bundle install` locally first (Lesson 9,
      # 2026-05-16: tagged v0.8.1 with version.rb + gemspec bumped to
      # 0.8.1 but Gemfile.lock still said inkpen (0.8.0), so bundler's
      # frozen install in setup-ruby failed with exit 16).
      - name: Verify Gemfile.lock matches gemspec version
        run: |
          gemspec_version=$(ruby -e 'require_relative "lib/inkpen/version"; puts Inkpen::VERSION')
          lockfile_version=$(grep -E '^    inkpen \([0-9]+\.[0-9]+\.[0-9]+\)' Gemfile.lock | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "$gemspec_version" != "$lockfile_version" ]; then
            cat <<EOF >&2
          ::error file=Gemfile.lock::Gemfile.lock version ($lockfile_version) differs from gemspec ($gemspec_version)

          When you bump lib/inkpen/version.rb / inkpen.gemspec, you MUST run
          \`bundle install\` locally before committing — otherwise Gemfile.lock
          still references the old version and CI's frozen install fails.
          See 01-inventlist/docs/agents/inkpen.agent.md Lesson 9.
          EOF
            exit 1
          fi
          echo "Gemfile.lock and gemspec agree at $gemspec_version ✓"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.3"
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install npm deps
        run: npm ci

      - name: Verify tag matches gemspec version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if ! printf '%s' "$DISPATCH_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Invalid release version: $DISPATCH_VERSION"
              exit 1
            fi
            tag="$DISPATCH_VERSION"
          else
            tag="${GITHUB_REF_NAME#v}"
          fi
          gemspec_version=$(ruby -e 'require_relative "lib/inkpen/version"; puts Inkpen::VERSION')
          if [ "$tag" != "$gemspec_version" ]; then
            echo "::error::Tag ($tag) does not match Inkpen::VERSION ($gemspec_version)"
            exit 1
          fi
          echo "Tag $tag matches Inkpen::VERSION $gemspec_version"

      - name: Rebuild vendored bundle
        run: npm run build

      - name: Verify bundle integrity
        run: npm run build:check

      - name: Run JS tests (spec 01 baseline)
        run: npm test

      - name: Build gem
        run: bundle exec rake build

      - name: Configure RubyGems trusted publishing credentials
        uses: rubygems/configure-rubygems-credentials@8674aee7f9f9055a8b771794d6f1e66b5fad36a9

      - name: Push gem to rubygems.org
        run: gem push pkg/inkpen-*.gem
